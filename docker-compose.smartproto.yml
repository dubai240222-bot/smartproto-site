# SP-A-056 — SmartProto Direct Publisher stack for Hetzner.
#
# factory (this worker) -> SQLite (bind-mounted, persistent) -> smartproto-web
# No GitHub / Vercel in this path. GitHub stays only as source-code backup.
#
# Deployed at /opt/apps/smartproto/ — does NOT touch any other project's
# containers, networks, or volumes on this shared host.
#
# Usage (from /opt/apps/smartproto/app):
#   docker compose -f ../docker-compose.smartproto.yml -p smartproto up -d --build

name: smartproto

services:
  smartproto-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ARTICLES_STORE: sqlite
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://www.smartproto.net}
    container_name: smartproto-web
    restart: unless-stopped
    environment:
      ARTICLES_STORE: sqlite
      SMARTPROTO_DB_PATH: /app/data/smartproto.db
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://www.smartproto.net}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      EDITORIAL_DOOR_SECRET: ${EDITORIAL_DOOR_SECRET}
    volumes:
      - ../data:/app/data
      - ../images:/app/public/media
    ports:
      - "127.0.0.1:3100:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  smartproto-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ARTICLES_STORE: sqlite
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://www.smartproto.net}
    container_name: smartproto-worker
    restart: unless-stopped
    command: ["npx", "tsx", "scripts/hetzner-worker.ts"]
    environment:
      ARTICLES_STORE: sqlite
      SMARTPROTO_DB_PATH: /app/data/smartproto.db
      SMARTPROTO_DATA_DIR: /app/data
      SMARTPROTO_FACTORY_ENABLED: "true"
      CHINA_DEPARTMENT_ENABLED: "true"
      CHINA_ALLOW_RECOMMEND: "true"
      SCOUT_SCORE_THRESHOLD: "70"
      SMARTPROTO_AI_RADAR_ENABLED: "${SMARTPROTO_AI_RADAR_ENABLED:-true}"
      SMARTPROTO_TEST_AUTO_DURATION_MS: "${SMARTPROTO_TEST_AUTO_DURATION_MS:-7200000}"
      SMARTPROTO_TEST_AUTO_SCOUT_THRESHOLD: "${SMARTPROTO_TEST_AUTO_SCOUT_THRESHOLD:-70}"
      SMARTPROTO_TEST_AUTO_INTERVAL_MS: "${SMARTPROTO_TEST_AUTO_INTERVAL_MS:-1200000}"
      SMARTPROTO_TEST_AUTO_MAX_TICKS: "${SMARTPROTO_TEST_AUTO_MAX_TICKS:-0}"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      EDITORIAL_DOOR_SECRET: ${EDITORIAL_DOOR_SECRET}
      # SP-A-074 — nightly retention (~01:00 local). Keeps ≥100 articles; max 25 deletes/run.
      SMARTPROTO_RETENTION_ENABLED: "${SMARTPROTO_RETENTION_ENABLED:-true}"
      SMARTPROTO_RETENTION_DAYS: "${SMARTPROTO_RETENTION_DAYS:-10}"
      SMARTPROTO_MIN_ARTICLES: "${SMARTPROTO_MIN_ARTICLES:-100}"
      SMARTPROTO_MAX_DELETE_PER_RUN: "${SMARTPROTO_MAX_DELETE_PER_RUN:-25}"
      SMARTPROTO_RETENTION_HOUR: "${SMARTPROTO_RETENTION_HOUR:-1}"
      SMARTPROTO_MEDIA_DIR: /app/public/media
    volumes:
      - ../data:/app/data
      - ../images:/app/public/media
