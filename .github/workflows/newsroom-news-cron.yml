# SP-A-054 — SHORT NEWS cycle (independent).
# Cron stays */25 so after warmup we resume ~2–3/h without another deploy.
# During SMARTPROTO_NEWS_WARMUP_UNTIL, tick enforces ~95m floor (4× slower).
# Max 1 publish per tick; skip if nothing worthy / cadence floor.
#
# Required: OPENROUTER_API_KEY + SMARTPROTO_FACTORY_ENABLED=true
# Optional var: SMARTPROTO_NEWS_WARMUP_UNTIL (ISO) — auto-expires to normal 25m.

name: Factory News Cycle

on:
  schedule:
    - cron: '*/25 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: factory-news-tick
  cancel-in-progress: false

jobs:
  news-tick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Factory gate
        id: gate
        env:
          FACTORY_SECRET: ${{ secrets.SMARTPROTO_FACTORY_ENABLED }}
          FACTORY_VAR: ${{ vars.SMARTPROTO_FACTORY_ENABLED }}
        run: |
          raw="${FACTORY_VAR:-}"
          if [ -z "$raw" ]; then raw="${FACTORY_SECRET:-}"; fi
          norm=$(printf '%s' "$raw" | tr -d '\r\n"'\''[:space:]' | tr '[:upper:]' '[:lower:]')
          case "$norm" in
            true|1|yes|on) echo "enabled=true" >> "$GITHUB_OUTPUT"; echo "Factory ON (news)" ;;
            *) echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "Factory OFF" ;;
          esac

      - name: Run news tick
        if: steps.gate.outputs.enabled == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SMARTPROTO_FACTORY_ENABLED: 'true'
          SMARTPROTO_CYCLE_TYPE: 'news'
          SMARTPROTO_NEWS_WARMUP_UNTIL: ${{ vars.SMARTPROTO_NEWS_WARMUP_UNTIL }}
          CHINA_DEPARTMENT_ENABLED: 'true'
          CHINA_ALLOW_RECOMMEND: 'true'
          SCOUT_SCORE_THRESHOLD: '70'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: npx tsx scripts/run-newsroom-tick.ts --cycle=news

      - name: Commit and push if changed
        if: steps.gate.outputs.enabled == 'true'
        run: |
          git config user.name "smartproto-newsroom-bot"
          git config user.email "newsroom-bot@users.noreply.github.com"
          git add -- src/data/articles.json data/factory-journal.json drafts/ || true
          if [ -f data/topic-rotation.json ]; then git add -- data/topic-rotation.json || true; fi
          git pull --rebase --autostash origin main || true
          git add -- src/data/articles.json data/factory-journal.json drafts/ || true
          if [ -f data/topic-rotation.json ]; then git add -- data/topic-rotation.json || true; fi
          if git diff --staged --quiet; then
            echo "No news publish this tick."
            exit 0
          fi
          git commit -m "feat(newsroom): news cycle publish"
          git push origin HEAD:main
          echo "Pushed — Vercel auto-deploy expected (no force vercel --prod)."
