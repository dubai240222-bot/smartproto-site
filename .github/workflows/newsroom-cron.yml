# SP-A-031-R2 — Interim autonomy: GitHub Actions cron → one newsroom tick → git push → Vercel.
# Stage B (Vercel Cron → /api/newsroom/tick → Worker → Postgres) remains PLANNED.
#
# TEST MODE cadence: every 3 minutes (prod can later return to */5 or */10).
# GitHub may delay free-tier schedules; expect ~3–5m in practice.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   OPENROUTER_API_KEY          — OpenRouter API key for Scout/Reviewer/Editor/Qwen
#   SMARTPROTO_FACTORY_ENABLED  — must be exactly: true  (no quotes; NOT "false")
#
# Optional repository Variable (easier toggle than a secret):
#   SMARTPROTO_FACTORY_ENABLED=true
#
# Turn OFF: set secret/variable to "false".
# Auth for push: GITHUB_TOKEN with contents: write (no extra PAT).

name: Newsroom Cron Tick

on:
  schedule:
    # TEST: every 3 minutes. Change to */5 or */10 for quieter production.
    - cron: '*/3 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsroom-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Factory gate
        id: gate
        env:
          FACTORY_SECRET: ${{ secrets.SMARTPROTO_FACTORY_ENABLED }}
          FACTORY_VAR: ${{ vars.SMARTPROTO_FACTORY_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Prefer visible repo Variable; fall back to Secret.
          # Normalize: strip whitespace/quotes/CRLF; accept true|1|yes|on.
          raw="${FACTORY_VAR:-}"
          if [ -z "$raw" ]; then raw="${FACTORY_SECRET:-}"; fi
          norm=$(printf '%s' "$raw" | tr -d '\r\n"'\''[:space:]' | tr '[:upper:]' '[:lower:]')
          echo "Factory normalized='$norm' (raw length ${#raw})"
          case "$norm" in
            true|1|yes|on)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              echo "Factory ON"
              factory_on=1
              ;;
            *)
              echo "Factory OFF. Set Actions secret OR variable SMARTPROTO_FACTORY_ENABLED to exactly: true"
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              factory_on=0
              ;;
          esac

          # SP-A-042: always emit a clear tick summary (even when factory OFF / AI skipped).
          echo ""
          echo "SMARTPROTO FACTORY TICK SUMMARY"
          if [ "$factory_on" = "1" ]; then
            echo "factoryEnabled: true"
            echo "event: ${EVENT_NAME}"
            echo "aiStarted: pending"
            echo "collectorStarted: pending"
            echo "publisherStarted: pending"
            echo "reason: factory gate open — newsroom:tick will run"
            echo "skipReason: none"
          else
            echo "factoryEnabled: false"
            echo "event: ${EVENT_NAME}"
            echo "aiStarted: false"
            echo "collectorStarted: false"
            echo "publisherStarted: false"
            echo "reason: SMARTPROTO_FACTORY_ENABLED is not true"
            echo "skipReason: SMARTPROTO_FACTORY_ENABLED is not true"
            echo "candidatesCollected: 0"
            echo "hardRejected: 0"
            echo "sentToQwen: 0"
            echo "sentToGemini: 0"
            echo "draftsCreated: 0"
            echo "articlesPublished: 0"
            echo "commitCreated: false"
            echo "pushDone: false"
          fi

      - name: Run one newsroom tick
        if: steps.gate.outputs.enabled == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SMARTPROTO_FACTORY_ENABLED: 'true'
          CHINA_DEPARTMENT_ENABLED: 'true'
          CHINA_ALLOW_RECOMMEND: 'true'
          # TEST: slightly lower Wow Score bar so the pipeline is not empty
          SCOUT_SCORE_THRESHOLD: '65'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: npm run newsroom:tick

      - name: Commit and push if changed
        if: steps.gate.outputs.enabled == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          git config user.name "smartproto-newsroom-bot"
          git config user.email "newsroom-bot@users.noreply.github.com"
          # Stage tick outputs before rebase. topic-rotation.json is optional —
          # including a missing pathspec in one `git add` aborts the whole add.
          git add -- src/data/articles.json data/factory-journal.json drafts/ || true
          if [ -f data/topic-rotation.json ]; then git add -- data/topic-rotation.json || true; fi
          git pull --rebase --autostash origin main || true
          git add -- src/data/articles.json data/factory-journal.json drafts/ || true
          if [ -f data/topic-rotation.json ]; then git add -- data/topic-rotation.json || true; fi
          if git diff --staged --quiet; then
            echo "No articles.json / journal / rotation / drafts changes — nothing to publish."
            echo ""
            echo "SMARTPROTO FACTORY TICK SUMMARY"
            echo "factoryEnabled: true"
            echo "event: ${EVENT_NAME}"
            echo "commitCreated: false"
            echo "pushDone: false"
            echo "skipReason: no staged article/journal/rotation/draft changes"
            exit 0
          fi
          git commit -m "feat(newsroom): autonomous tick publish"
          git push origin HEAD:main
          echo ""
          echo "SMARTPROTO FACTORY TICK SUMMARY"
          echo "factoryEnabled: true"
          echo "event: ${EVENT_NAME}"
          echo "commitCreated: true"
          echo "pushDone: true"
          echo "skipReason: none"
