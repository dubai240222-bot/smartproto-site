# SP-A-050 — FULL ARTICLE / REVIEW cycle (independent of news).
# Max 1 publish / 60 minutes. Fuller piece + consumer scenario + Wow Score.
#
# Required: OPENROUTER_API_KEY + SMARTPROTO_FACTORY_ENABLED=true

name: Factory Article Cycle

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: factory-article-tick
  cancel-in-progress: false

jobs:
  article-tick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Factory gate
        id: gate
        env:
          FACTORY_SECRET: ${{ secrets.SMARTPROTO_FACTORY_ENABLED }}
          FACTORY_VAR: ${{ vars.SMARTPROTO_FACTORY_ENABLED }}
        run: |
          raw="${FACTORY_VAR:-}"
          if [ -z "$raw" ]; then raw="${FACTORY_SECRET:-}"; fi
          norm=$(printf '%s' "$raw" | tr -d '\r\n"'\''[:space:]' | tr '[:upper:]' '[:lower:]')
          case "$norm" in
            true|1|yes|on) echo "enabled=true" >> "$GITHUB_OUTPUT"; echo "Factory ON (article)" ;;
            *) echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "Factory OFF" ;;
          esac

      - name: Run article tick
        if: steps.gate.outputs.enabled == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SMARTPROTO_FACTORY_ENABLED: 'true'
          SMARTPROTO_CYCLE_TYPE: 'article'
          CHINA_DEPARTMENT_ENABLED: 'true'
          CHINA_ALLOW_RECOMMEND: 'true'
          SCOUT_SCORE_THRESHOLD: '75'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: npx tsx scripts/run-newsroom-tick.ts --cycle=article

      - name: Commit and push if changed
        if: steps.gate.outputs.enabled == 'true'
        run: |
          git config user.name "smartproto-newsroom-bot"
          git config user.email "newsroom-bot@users.noreply.github.com"
          git add -- src/data/articles.json data/factory-journal.json drafts/ || true
          if [ -f data/topic-rotation.json ]; then git add -- data/topic-rotation.json || true; fi
          git pull --rebase --autostash origin main || true
          git add -- src/data/articles.json data/factory-journal.json drafts/ || true
          if [ -f data/topic-rotation.json ]; then git add -- data/topic-rotation.json || true; fi
          if git diff --staged --quiet; then
            echo "No article publish this tick."
            exit 0
          fi
          git commit -m "feat(newsroom): article cycle publish"
          git push origin HEAD:main
          echo "Pushed — Vercel auto-deploy expected (no force vercel --prod)."
